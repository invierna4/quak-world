<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUAK — Different ways of being close.</title>
<meta name="description" content="QUAK is a quiet digital space for two people to feel connected without the pressure to talk.">
<meta name="theme-color" content="#fbfaf6">
<style>
:root{--ink:#171918;--green:#789c67;--muted:#68706b;--paper:#fbfaf6;--soft:#f1f4ee}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,-apple-system,sans-serif}
main{min-height:100vh}.hero{min-height:82svh;display:grid;place-items:center;padding:64px 24px}.wrap{width:min(860px,92vw);text-align:center}
.brand{width:min(420px,78vw);margin:0 auto 64px}.letters{position:relative;display:inline-block;font-size:clamp(58px,10vw,108px);font-weight:650;letter-spacing:.12em;line-height:.9}
.marks{position:absolute;left:96%;top:-38%;width:72px;height:64px}.marks i{position:absolute;display:block;width:13px;height:34px;border-radius:50%;background:var(--green)}
.marks i:nth-child(1){left:3px;top:7px;transform:rotate(5deg)}.marks i:nth-child(2){left:28px;top:18px;transform:rotate(42deg)}.marks i:nth-child(3){left:49px;top:39px;transform:rotate(78deg)}
.swoop{width:78%;height:44px;margin:18px auto 0;border-bottom:12px solid var(--ink);border-radius:0 0 55% 45%;transform:rotate(2deg)}
h1{font-size:clamp(30px,4.5vw,52px);font-weight:550;letter-spacing:-.035em;margin:0 0 20px}.lede{font-size:clamp(17px,2vw,21px);line-height:1.6;max-width:640px;margin:auto;color:var(--muted)}
.philosophy{padding:120px 24px;background:var(--soft);text-align:center}.philosophy p{max-width:760px;margin:auto;font-family:Georgia,serif;font-size:clamp(27px,4vw,45px);line-height:1.28;letter-spacing:-.02em}
footer{padding:36px 24px;text-align:center;background:var(--soft);color:#7a827c;font-size:13px;letter-spacing:.1em}
@media(max-width:520px){.brand{margin-bottom:50px}.marks{transform:scale(.8);transform-origin:left bottom}.swoop{border-bottom-width:9px}}
</style>
</head>
<body><main>
<section class="hero"><div class="wrap">
<div class="brand" aria-label="QUAK"><div class="letters">QUAK<span class="marks"><i></i><i></i><i></i></span></div><div class="swoop"></div></div>
<h1>Different ways of being close.</h1>
<p class="lede">A quiet digital space for two people to feel connected without the pressure to talk.</p>
</div></section>
<section class="philosophy"><p>QUAK does not try to fix people. It creates room for different ways of being close.</p></section>
</main><footer>QUAK · COMING SOON</footer></body></html>
