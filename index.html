<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QUAK — Different ways of being close.</title>
<meta name="description" content="QUAK is an alternative social app to feel connected without talking.">
<meta name="theme-color" content="#fbfaf6">
<style>
:root{--ink:#17201f;--muted:#666967;--paper:#fbfaf6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Avenir Next",Avenir,system-ui,-apple-system,sans-serif}
.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:52px 24px}
.wrap{width:min(1120px,94vw);text-align:center}
.logo{display:block;width:min(320px,56vw);height:auto;margin:0 auto 56px}
h1{margin:0 0 20px;font-size:clamp(38px,5.7vw,76px);font-weight:500;letter-spacing:-.045em;line-height:1.08}
.lede{margin:0 auto;color:var(--muted);font-size:clamp(18px,2.4vw,30px);line-height:1.45;font-weight:400}
.frog{display:block;width:min(440px,74vw);height:auto;margin:52px auto 0}
.coming{margin:26px 0 0;color:#777a78;font-size:14px;letter-spacing:.16em}
@media(max-width:600px){
 .hero{padding:40px 20px}
 .logo{width:min(260px,66vw);margin-bottom:46px}
 h1{font-size:clamp(34px,10vw,50px)}
 .lede{font-size:18px;max-width:520px}
 .frog{width:min(360px,88vw);margin-top:44px}
 .coming{margin-top:22px}
}
</style>
</head>
<body>
<main class="hero"><div class="wrap">
<img class="logo" src="assets/quak-logo.webp" alt="QUAK">
<h1>Different ways of being close.</h1>
<p class="lede">An alternative social app to feel connected without talking.</p>
<img class="frog" src="assets/quak-frog.webp" alt="" aria-hidden="true">
<p class="coming">Coming soon.</p>
</div></main>
</body>
</html>
